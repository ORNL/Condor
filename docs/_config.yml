title: Condor
description: Performance-portable semi-analytical thermal simulation for metal additive manufacturing
url: "https://ORNL.github.io"
baseurl: "/Condor"
repository: ORNL/Condor

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: condor
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - build/
  - Condor-wordmark.png
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - _site/
  - docs/.bundle/
  - docs/.jekyll-cache/
  - docs/_site/
  - docs/vendor/

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true
enable_copy_code_button: true

aux_links:
  "Source":
    - "https://github.com/ORNL/Condor"

aux_links_new_tab: false

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Model boundary
    color: yellow

footer_content: >-
  Condor is distributed under the BSD 3-Clause License.

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
